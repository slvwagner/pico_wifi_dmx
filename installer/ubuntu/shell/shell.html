<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFiPicoDMX</title>
<style>
:root{color-scheme:dark;font:13px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#12161d;color:#e6ebf2}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#12161d}
button{font:inherit;color:#e6ebf2;cursor:pointer;-webkit-app-region:no-drag}
button:focus-visible{outline:2px solid #7aa2d6;outline-offset:-2px}
#titlebar{height:44px;display:flex;align-items:center;gap:10px;padding:0 150px 0 12px;background:#1c212a;border-bottom:1px solid #303846;-webkit-app-region:drag;user-select:none}
#titlebar img{width:24px;height:24px} #titlebar strong{font-size:14px;letter-spacing:.01em}
#menubar{height:32px;display:flex;align-items:stretch;padding-left:4px;background:#1c212a;border-bottom:1px solid #303846;position:relative;z-index:2}
.menu-button{border:0;border-radius:0;background:transparent;padding:0 11px}.menu-button:hover,.menu-button[aria-expanded=true]{background:#303a48}
.menu{position:absolute;display:none;top:31px;min-width:210px;padding:5px;background:#1c212a;border:1px solid #4a586a;box-shadow:0 8px 24px #0009}
.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:7px 28px 7px 10px}.menu button:hover{background:#303a48}.menu hr{height:1px;border:0;background:#4a586a;margin:4px}
#application-menu{left:4px}#view-menu{left:87px}
#status{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;padding:0 10px;background:#1c212a;border-top:1px solid #303846;color:#bac4d1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fullscreenbar{display:none;height:44px;align-items:center;gap:8px;padding:6px 10px;background:#1c212a;border-bottom:1px solid #303846}
.action{background:#303a48;border:1px solid #4a586a;border-radius:4px;padding:5px 11px}.action:hover{background:#3b4859}.danger{background:#742a31;border-color:#91363e}.danger:hover{background:#91363e}.spacer{flex:1}
body.fullscreen #titlebar,body.fullscreen #menubar,body.fullscreen #status{display:none}body.fullscreen #fullscreenbar{display:flex}
#exit-overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#080a0dcc}#exit-overlay.open{display:grid}
#exit-dialog{width:min(570px,calc(100vw - 48px));padding:22px 24px 18px;background:#12161d;border:1px solid #4a586a;border-radius:7px;box-shadow:0 18px 60px #000c}
#exit-dialog h1{font-size:16px;margin:0 0 13px}#exit-dialog p{margin:0 0 18px;color:#bac4d1}#exit-dialog strong{color:#e6ebf2}.dialog-buttons{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<header id="titlebar"><img src="icon.png" alt=""><strong>WiFiPicoDMX</strong></header>
<nav id="menubar" aria-label="Application menu">
  <button class="menu-button" data-menu="application-menu" aria-expanded="false">Application</button>
  <button class="menu-button" data-menu="view-menu" aria-expanded="false">View</button>
  <div class="menu" id="application-menu" role="menu">
    <button data-action="home" role="menuitem">Open controller</button>
    <button data-action="reload" role="menuitem">Reload</button><hr>
    <button data-action="firmware" role="menuitem">Firmware update…</button><hr>
    <button data-action="browser" role="menuitem">Open in browser</button><hr>
    <button data-action="close" role="menuitem">Exit…</button>
  </div>
  <div class="menu" id="view-menu" role="menu"><button data-action="fullscreen" role="menuitem">Toggle full screen <span style="float:right;color:#bac4d1">F11</span></button></div>
</nav>
<nav id="fullscreenbar" aria-label="Full screen controls"><button class="action" data-action="exit-fullscreen">Exit full screen</button><span class="spacer"></span><button class="action danger" data-action="close">Close application</button></nav>
<footer id="status">Waiting for the Pico DMX server…</footer>
<div id="exit-overlay" role="presentation"><section id="exit-dialog" role="dialog" aria-modal="true" aria-labelledby="exit-heading">
  <h1 id="exit-heading">How should WiFiPicoDMX exit?</h1>
  <p><strong>Exit only</strong><br>Keep the server running for iPads and other operator devices.</p>
  <p><strong>Exit and stop server</strong><br>Stopping the server disconnects iPads and other operator devices.</p>
  <div class="dialog-buttons"><button class="action" data-exit="keep">Exit only</button><button class="action danger" data-exit="stop">Exit and stop server</button><button class="action" data-exit="cancel">Cancel</button></div>
</section></div>
<script>
'use strict';
const actions={browser:()=>window.picoShell.openBrowser(),close:()=>window.picoShell.close(),'exit-fullscreen':()=>window.picoShell.exitFullscreen(),firmware:()=>window.picoShell.openFirmware(),fullscreen:()=>window.picoShell.toggleFullscreen(),home:()=>window.picoShell.home(),reload:()=>window.picoShell.reload()};
let menuOpen=false;const closeMenus=()=>{document.querySelectorAll('.menu.open').forEach((menu)=>menu.classList.remove('open'));document.querySelectorAll('[data-menu]').forEach((button)=>button.setAttribute('aria-expanded','false'));if(menuOpen){menuOpen=false;window.picoShell.setMenuOpen(false);}};
document.addEventListener('click',(event)=>{const menuButton=event.target.closest('[data-menu]');if(menuButton){const menu=document.getElementById(menuButton.dataset.menu);const opening=!menu.classList.contains('open');closeMenus();if(opening){menu.classList.add('open');menuButton.setAttribute('aria-expanded','true');menuOpen=true;window.picoShell.setMenuOpen(opening);}return;}const exit=event.target.closest('[data-exit]')?.dataset.exit;if(exit){document.getElementById('exit-overlay').classList.remove('open');window.picoShell.chooseExit(exit);return;}const action=event.target.closest('[data-action]')?.dataset.action;if(action&&actions[action]){closeMenus();actions[action]();}else closeMenus();});
document.addEventListener('keydown',(event)=>{if(event.key==='Escape'&&document.getElementById('exit-overlay').classList.contains('open')){document.getElementById('exit-overlay').classList.remove('open');window.picoShell.chooseExit('cancel');}});
window.picoShell.onStatus((message)=>{document.getElementById('status').textContent=message;});
window.picoShell.onFullscreenState((enabled)=>{document.body.classList.toggle('fullscreen',enabled);});
window.picoShell.onShowExitChoice(()=>{closeMenus();document.getElementById('exit-overlay').classList.add('open');document.querySelector('[data-exit="keep"]').focus();});
</script>
</body>
</html>
