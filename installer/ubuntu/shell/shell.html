<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFiPicoDMX</title>
<style>
:root{color-scheme:dark;font:13px/1.3 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#12161d;color:#e6ebf2}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#12161d}
button{font:inherit;color:#e6ebf2;background:#303a48;border:1px solid #4a586a;border-radius:5px;padding:5px 11px;cursor:pointer;-webkit-app-region:no-drag}
button:hover{background:#3b4859}
button:focus-visible{outline:2px solid #7aa2d6;outline-offset:1px}
#titlebar{height:44px;display:flex;align-items:center;gap:10px;padding:0 150px 0 12px;background:#1c212a;border-bottom:1px solid #303846;-webkit-app-region:drag;user-select:none}
#titlebar img{width:24px;height:24px}
#titlebar strong{font-size:14px;letter-spacing:.01em}
#toolbar{height:36px;display:flex;align-items:center;gap:7px;padding:4px 10px;background:#1c212a;border-bottom:1px solid #303846}
#toolbar .spacer{flex:1}
#status{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;padding:0 10px;background:#1c212a;border-top:1px solid #303846;color:#bac4d1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fullscreenbar{display:none;height:44px;align-items:center;gap:8px;padding:6px 10px;background:#1c212a;border-bottom:1px solid #303846}
#fullscreenbar .spacer{flex:1}
#close{background:#742a31;border-color:#91363e}
#close:hover{background:#91363e}
body.fullscreen #titlebar,body.fullscreen #toolbar,body.fullscreen #status{display:none}
body.fullscreen #fullscreenbar{display:flex}
</style>
</head>
<body>
<header id="titlebar">
  <img src="icon.png" alt="">
  <strong>WiFiPicoDMX</strong>
</header>
<nav id="toolbar" aria-label="Application controls">
  <button type="button" data-action="home">Controller</button>
  <button type="button" data-action="reload">Reload</button>
  <button type="button" data-action="fullscreen">Full screen</button>
  <span class="spacer"></span>
  <button type="button" data-action="browser">Open in browser</button>
</nav>
<nav id="fullscreenbar" aria-label="Full screen controls">
  <button type="button" data-action="exit-fullscreen">Exit full screen</button>
  <span class="spacer"></span>
  <button id="close" type="button" data-action="close">Close application</button>
</nav>
<footer id="status">Waiting for the Pico DMX server…</footer>
<script>
'use strict';
const actions = {
  browser: () => window.picoShell.openBrowser(),
  close: () => window.picoShell.close(),
  'exit-fullscreen': () => window.picoShell.exitFullscreen(),
  fullscreen: () => window.picoShell.toggleFullscreen(),
  home: () => window.picoShell.home(),
  reload: () => window.picoShell.reload(),
};
document.addEventListener('click', (event) => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action && actions[action]) actions[action]();
});
window.picoShell.onStatus((message) => {
  document.getElementById('status').textContent = message;
});
window.picoShell.onFullscreenState((enabled) => {
  document.body.classList.toggle('fullscreen', enabled);
});
</script>
</body>
</html>
